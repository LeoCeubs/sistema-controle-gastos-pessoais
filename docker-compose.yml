services:
  api:
    build: .
    container_name: gastos-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      # RNF02: banco SQLite em volume nomeado, sobrevive a recriacao do container
      - dados:/app/data
      # desenvolvimento: codigo do host refletido no container
      - ./app:/app/app
      - ./static:/app/static
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  dados:
